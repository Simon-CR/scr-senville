# Senville Aura (Midea OEM) ESPHome Configuration
# Target Hardware: Pre-built USB-A Midea Dongle (SMLIGHT SLWF-01pro v1/v2 / CloudFree / Dudanov iot-uni-dongle)
# MCU: ESP8266 (ESP-12E / ESP-12F) or ESP-01S (change board to esp01_1m if using ESP-01S)
# Features:
#   - Full local UART control (9600 baud) replacing the stock Alexa/OSK103/OSK105 USB-A dongle
#   - Full MQTT support with Home Assistant MQTT Auto-Discovery (mitsubishi2mqtt style)
#   - Simultaneous Home Assistant Native API support
#   - Custom MQTT topics for Follow-Me remote room sensor & front panel LED display toggle

substitutions:
  device_name: senville-aura-ac
  friendly_name: "Senville Aura AC"
  mqtt_prefix: senville_ac

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: "Senville Aura (Midea OEM) Local MQTT & HA Climate Controller"

esp8266:
  board: esp12e

# Dual control paths: Home Assistant Native API + Full MQTT (with HA Auto-Discovery)
api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: none
  ap:
    ssid: "${device_name}-fallback"
    password: !secret fallback_ap_password

captive_portal:

web_server:
  port: 80
  version: 2

# IMPORTANT: baud_rate MUST be 0 on ESP8266 because the Midea USB-A port uses hardware UART0 (GPIO1/GPIO3)
logger:
  level: INFO
  baud_rate: 0

# Hardware UART0 connected to the Senville Aura USB-A port (via internal 5V<->3.3V level shifter)
# USB-A Pin 1: +5V | Pin 2 (D-): AC TX -> ESP RX (GPIO3) | Pin 3 (D+): AC RX <- ESP TX (GPIO1) | Pin 4: GND
uart:
  id: midea_uart
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: 9600

# MQTT Client (mirrors mitsubishi2mqtt behavior with Home Assistant Auto-Discovery + custom topics)
mqtt:
  broker: !secret mqtt_broker
  port: 1883
  username: !secret mqtt_username
  password: !secret mqtt_password
  topic_prefix: ${mqtt_prefix}
  discovery: true
  discovery_prefix: homeassistant
  birth_message:
    topic: ${mqtt_prefix}/status
    payload: online
  will_message:
    topic: ${mqtt_prefix}/status
    payload: offline

  on_message:
    # Publish a temperature in °C (e.g. "21.5") to senville_ac/follow_me/set to override the AC's internal thermistor
    - topic: ${mqtt_prefix}/follow_me/set
      then:
        - if:
            condition:
              lambda: |-
                auto val = parse_number<float>(x);
                return val.has_value() && val.value() >= 10.0f && val.value() <= 35.0f;
            then:
              - midea_ac.follow_me:
                  id: senville_climate
                  temperature: !lambda "return parse_number<float>(x).value();"
                  beeper: false

    # Publish any payload (e.g. "TOGGLE") to senville_ac/display/set to toggle the indoor unit's LED display
    - topic: ${mqtt_prefix}/display/set
      then:
        - midea_ac.display_toggle:
            id: senville_climate

# Midea / Senville Aura Climate Entity
climate:
  - platform: midea
    id: senville_climate
    name: "Climate"
    uart_id: midea_uart
    period: 1s
    timeout: 2s
    num_attempts: 3
    autoconf: true
    beeper: false

    supported_modes:
      - "OFF"
      - "HEAT_COOL"
      - "COOL"
      - "HEAT"
      - "DRY"
      - "FAN_ONLY"

    supported_swing_modes:
      - "OFF"
      - "VERTICAL"
      - "HORIZONTAL"
      - "BOTH"

    supported_presets:
      - "ECO"
      - "BOOST"
      - "SLEEP"

    custom_presets:
      - "FREEZE_PROTECTION"

    custom_fan_modes:
      - "SILENT"
      - "TURBO"

    outdoor_temperature:
      name: "Outdoor Temperature"
      id: outdoor_temp

    power_usage:
      name: "Power Usage"
      id: power_watts

    humidity_setpoint:
      name: "Humidity Setpoint"
      id: humidity_target

# Button Entity (exposed in HA & MQTT) to toggle the Senville Aura front-panel LED readout
button:
  - platform: template
    name: "Toggle Display LED"
    id: display_toggle_btn
    icon: "mdi:led-on"
    on_press:
      - midea_ac.display_toggle:
          id: senville_climate

  - platform: restart
    name: "Restart Dongle"

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
  - platform: uptime
    name: "Uptime"
